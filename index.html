<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="weather-app">
    <header>
  <form class="search-form" id="search-form">
    <input type="search" placeholder="Enter a city..." class="search-input" id="search-input">
    <input type="submit" value="search" class="search-button">
  </form>
    </header>
    <main>
      <div class="weather-data">
        <div><h1 class="weather-city" id="weather-city"></h1>
    <p class="weather-details"><span id="current-date"></span>,<span id="description">scattered cloud</span> <br>
    Humudity: <span id="humidity"></span> , windspeed: <span id="windspeed"></span>
    </p></div>
    <div class="weather-temperature">
<div id="icon">
 
</div>
<div class="weather-Num" id="weather-Num"></div><div class="weather-degree">&deg;C</div></div></div>
<div class="weather-forecast">
  <div class="weather-forecast-day"> 
    <div class="weather-forecast-date">Tue</div> 
     <div class="weather-forecast-icon">🌥</div> 
      <div class="weather-forecast-temp">
         <div class="weather-forecast-temper"><strong>15°</strong></div>
         <div class="weather-forecast-temper"> 9°</div></div> 
     </div>
     <div class="weather-forecast-day"> 
    <div class="weather-forecast-date">Wed</div> 
     <div class="weather-forecast-icon">🌥</div> 
      <div class="weather-forecast-temp">
         <div class="weather-forecast-temper"><strong>15°</strong></div>
         <div class="weather-forecast-temper"> 9°</div></div> 
     </div>
      <div class="weather-forecast-day"> 
    <div class="weather-forecast-date">Thurs</div> 
     <div class="weather-forecast-icon">🌥</div> 
      <div class="weather-forecast-temp">
         <div class="weather-forecast-temper"><strong>15°</strong></div>
         <div class="weather-forecast-temper"> 9°</div></div> 
     </div>
      <div class="weather-forecast-day"> 
    <div class="weather-forecast-date">Fri</div> 
     <div class="weather-forecast-icon">🌥</div> 
      <div class="weather-forecast-temp">
         <div class="weather-forecast-temper"><strong>15°</strong></div>
         <div class="weather-forecast-temper"> 9°</div></div> 
     </div>
      <div class="weather-forecast-day"> 
    <div class="weather-forecast-date">Sat</div> 
     <div class="weather-forecast-icon">🌥</div> 
      <div class="weather-forecast-temp">
         <div class="weather-forecast-temper"><strong>15°</strong></div>
         <div class="weather-forecast-temper"> 9°</div></div> 
     </div>

 
</div>
</main>
    
    <footer>This project is coded by <a href="https://github.com/samrawit-21/weather-forecast" target="_blank"> samrawit</a> and hosted on <a href="https://app.netlify.com/projects/samweatherrrr/deploys" target="_blank">Netilify</a></footer>
</div>
  <script src="index.js"></script>
  </body>
</html>
